<!DOCTYPE html>
<!-- cleaned: removed stray code-fence marker -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise 💗</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffe6f0;
            text-align: center;
            padding: 30px 15px;
            color: #d63384;
            overflow-x: hidden;
        }

        .container {
            background: white;
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #e8a5c2;
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">

                <title>Birthday Surprise 💗</title>

                <style>
                    body { font-family: Arial, sans-serif; background: #ffe6f0; text-align: center; padding: 30px 15px; color: #d63384; }
                    .container { background: white; max-width: 420px; margin: 30px auto; padding: 20px; border-radius: 16px; box-shadow: 0 5px 15px #e8a5c2; }
                    #photoPreview { width: 100%; max-width: 320px; border-radius: 12px; margin: 12px auto; display: none; }
                    h1 { color: #ff4d94; }
                    input[type="text"] { width: 85%; padding: 10px; border: 1px solid #ff99c2; border-radius: 10px; margin: 8px 0; }
                    input[type="file"] { margin: 8px 0; }
                    button { background: #ff4d94; color: white; border: none; padding: 12px 18px; border-radius: 10px; cursor: pointer; margin-top: 10px; }
                    button:hover { background: #e60073; }
                    #surprise { display: none; margin-top: 18px; line-height: 1.6; }
                </style>
            </head>

            <body>

                <div class="container">
                    <h1></h1>

                    <!-- Embedded photo (inlined SVG) -->
                    <svg id="photoPreview" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Birthday photo" style="display:block; margin:12px auto; max-width:320px; width:100%; height:auto;">
                        <defs>
                            <linearGradient id="g" x1="0" x2="1">
                                <stop offset="0" stop-color="#fff0f6" />
                                <stop offset="1" stop-color="#ffe6f0" />
                            </linearGradient>
                        </defs>
                        <rect width="100%" height="100%" fill="url(#g)" />
                        <g>
                            <rect x="20" y="20" width="560" height="360" rx="20" fill="#fff" stroke="#ff99c2" stroke-width="6" />
                            <text x="300" y="170" font-size="36" fill="#ff4d94" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Happy Birthday</text>
                            <text x="300" y="220" font-size="28" fill="#d63384" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">💖</text>
                        </g>
                    </svg>

                    <p>ILAGAY MO UNG NAME MO NA LAGI KONG TAWAG SAU 💕</p>

                    <input type="text" id="name" placeholder="Enter your name...">

                    <br>

                    <button id="surpriseBtn">Click for a Surprise 🎁</button>

                    <div id="surprise">
                        <h2 id="greeting"></h2>
                        <p id="personalMessage"></p>
                        <p></p>
                        <p></p>
                        <h3></h3>
                    </div>
                </div>

                <script>
                    // Surprise logic
                    const photoPreview = document.getElementById('photoPreview');
                    photoPreview.style.display = 'block';
                    document.getElementById('surpriseBtn').addEventListener('click', showSurprise);

                    function showSurprise() {
                                        const name = document.getElementById('name').value.trim();
                                        if (name === '') { alert('Please enter your name first! 💗'); return; }
                                        document.getElementById('greeting').textContent = 'Happy Birthday, ' + name + '! 💖';

                                        // Personalized message requested by user
                                        const personal = "Happy happy Birthday to this cute girl pau pau,  I hope your day is filled with happiness, love, and lots of smiles. Always take care of yourself i'm here palagi para awayin  ka djk, I wish you all the best in life, and I hope all your wishes come true. Enjoy your special day! Pau mwaps";
                                        document.getElementById('personalMessage').textContent = personal;

                                        document.getElementById('surprise').style.display = 'block';
                                        celebration();
                                        document.getElementById('surprise').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                                    }

                    function celebration() {
                        const colors = ['#ff4d94','#ffd700','#a855f7','#00c9a7','#ff7043','#4dabf7'];
                        for (let i = 0; i < 90; i++) {
                            const confetti = document.createElement('div');
                            confetti.style.position = 'fixed';
                            confetti.style.top = '-10px';
                            confetti.style.left = Math.random() * 100 + 'vw';
                            confetti.style.width = '8px';
                            confetti.style.height = '12px';
                            confetti.style.background = colors[Math.floor(Math.random()*colors.length)];
                            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                            confetti.style.zIndex = 9999;
                            confetti.style.pointerEvents = 'none';
                            confetti.style.transition = 'transform 3s linear, opacity 3s linear';
                            document.body.appendChild(confetti);
                            requestAnimationFrame(() => {
                                confetti.style.transform = 'translateY(110vh) rotate(' + (360+Math.random()*720) + 'deg)';
                                confetti.style.opacity = '0';
                            });
                            setTimeout(() => confetti.remove(), 3500);
                        }
                    }
                </script>

            </body>
            </html>
